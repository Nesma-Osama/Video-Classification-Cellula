<!DOCTYPE html>
<html>

<head>
    <title>Prediction Result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            text-align: center;
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        a {
            display: block;
            text-align: center;
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border-radius: 4px;
            text-decoration: none;
            width: 200px;
            margin: 0 auto;
        }

        a:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>
    <div>
        <h1>Prediction: {{ label }}</h1>
        <p>Confidence: {{ confidence }}</p>
        <a href="{% url 'home' %}">Upload another video</a>
    </div>
</body>

</html>
